<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Barobogi 웹 번역</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <strong>Barobogi 웹 번역</strong>
    <span id="engine" class="pill">확인 중</span>
  </header>

  <section id="consent" hidden>
    <p>페이지 글자와 보이는 탭 화면을 이 Mac의 Barobogi 앱으로 보내 번역합니다.</p>
    <button id="agree" class="primary">동의하고 사용</button>
  </section>

  <section id="main" hidden>
    <div class="switch" id="viewSwitch" role="group" aria-label="번역 보기 전환">
      <button id="translate" class="switchSide">번역 보기</button>
      <button id="original" class="switchSide">원문 보기</button>
    </div>
    <p id="autoStatus" class="auto"></p>

    <div class="group">
      <h2 class="groupTitle">언어</h2>
      <label class="row">번역 언어
        <select id="target">
          <option value="ko">한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh-Hans">중국어(간체)</option>
          <option value="zh-Hant">중국어(번체)</option>
        </select>
      </label>
      <label class="row">번역 글꼴
        <span class="rowEnd">
          <select id="fontStyle">
            <option value="auto">자동(기본)</option>
            <option value="gothic">고딕</option>
            <option value="myeongjo">명조</option>
            <option value="gungseo">궁서</option>
            <option value="hand">손글씨</option>
          </select>
          <span class="help" title="자동은 원본 글자 모양으로 추정하며, 애매하면 고딕을 씁니다. 이미지 속 글자 번역은 항상 켜져 있습니다.">?</span>
        </span>
      </label>
      <button id="langPack" class="linkButton langPackButton">언어팩</button>
    </div>
  </section>

  <footer>
    <p id="status" class="status"><span id="spinner" class="spinner" hidden aria-hidden="true"></span><span id="statusText"></span></p>
    <p id="langStats" class="langStats" title="텍스트 조각·OCR 문단 기준" hidden></p>
    <p id="error" class="error" hidden></p>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
