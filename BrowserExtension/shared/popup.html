<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>SMT 웹 번역</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="18" height="18">
    <strong>SMT 웹 번역</strong>
    <span id="engine" class="pill">확인 중</span>
  </header>

  <section id="consent" hidden>
    <p>번역할 때 이 페이지의 글자와 보이는 탭 화면(이미지 글자 인식용)을 이 Mac의 SMT 앱으로만 보냅니다.
      SMT는 Mac 기본 번역(기기 내)으로 번역하고 내용을 저장하지 않습니다. 외부 AI로 보내지 않습니다.</p>
    <button id="agree" class="primary">동의하고 사용</button>
  </section>

  <section id="main" hidden>
    <label class="row">번역 언어
      <select id="target">
        <option value="ko">한국어</option>
        <option value="en">영어</option>
        <option value="ja">일본어</option>
        <option value="zh-Hans">중국어(간체)</option>
      </select>
    </label>
    <div class="buttons">
      <button id="translate" class="primary">이 페이지 번역</button>
      <button id="original">원문 보기</button>
    </div>
    <label class="check"><input type="checkbox" id="auto"> <span id="autoLabel">이 사이트 자동 번역 (스크롤 멈춘 뒤 1초)</span></label>
    <label class="check"><input type="checkbox" id="images"> 이미지 속 글자도 번역</label>
  </section>

  <p id="status" class="status"></p>
  <p id="error" class="error" hidden></p>
  <footer>Mac 기본 번역(기기 내) · SMT 앱의 번역 방식 설정과 별개</footer>
  <script src="popup.js"></script>
</body>
</html>
