<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>SMT 웹 번역</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="18" height="18">
    <strong>SMT 웹 번역</strong>
    <span id="engine" class="pill">확인 중</span>
  </header>

  <section id="consent" hidden>
    <p>페이지 글자와 보이는 탭 화면을 이 Mac의 SMT 앱으로 보내 번역합니다.</p>
    <button id="agree" class="primary">동의하고 사용</button>
  </section>

  <section id="main" hidden>
    <label class="row">번역 언어
      <span class="rowEnd">
        <select id="target">
          <option value="ko">한국어</option>
          <option value="en">영어</option>
          <option value="ja">일본어</option>
          <option value="zh-Hans">중국어(간체)</option>
          <option value="zh-Hant">중국어(번체)</option>
        </select>
        <a class="help" href="https://support.apple.com/ko-kr/guide/mac-help/mchldd8b3c15/mac" target="_blank" rel="noopener noreferrer" title="언어 팩 관리 안내">언어 팩 관리 안내</a>
      </span>
    </label>
    <label class="row" hidden>번역 엔진
      <select id="engineSelect">
        <option value="apple">Mac 기본 번역(기기 내)</option>
      </select>
    </label>
    <section id="engineConsent" class="engineConsent" hidden>
      <p id="engineConsentText"></p>
      <div class="buttons">
        <button id="engineAgree" class="primary">동의하고 사용</button>
        <button id="engineCancel">취소</button>
      </div>
    </section>
    <p id="engineNote" class="auto" hidden></p>
    <div class="buttons">
      <button id="translate" class="primary">번역</button>
      <button id="original" title="원문 보기를 누르면 열려 있는 모든 탭에서 자동 번역이 꺼집니다.">원문 보기</button>
    </div>
    <p id="autoStatus" class="auto"></p>
    <label class="check"><input type="checkbox" id="images"> 이미지 속 글자도 번역</label>
    <label class="row">이미지 글꼴
      <span class="rowEnd">
        <select id="fontStyle">
          <option value="auto">자동(기본)</option>
          <option value="gothic">고딕</option>
          <option value="myeongjo">명조</option>
          <option value="gungseo">궁서</option>
          <option value="hand">손글씨</option>
        </select>
        <span class="help" title="자동은 원본 글자 모양으로 추정하며, 애매하면 고딕을 씁니다.">?</span>
      </span>
    </label>
  </section>

  <p id="status" class="status"></p>
  <p id="langStats" class="langStats" title="텍스트 조각·OCR 문단 기준" hidden></p>
  <p id="error" class="error" hidden></p>
  <script src="popup.js"></script>
</body>
</html>
